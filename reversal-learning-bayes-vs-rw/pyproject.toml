[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "revlearn"
version = "1.0.0"
description = "Bayesian vs Rescorla-Wagner models of probabilistic reversal learning: simulation, recovery, fitting, model comparison, posterior-predictive checks"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
